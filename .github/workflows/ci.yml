name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything in `npm run verify` except the browser tests.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check:dependencies
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run test:unit
      - run: npm run build

  # The Playwright image the browser jobs run in, read from
  # .github/playwright-image: a data file, so `npm run deps:sync` can update it
  # from a workflow (the workflow token may not change workflow files). It must
  # name Microsoft's image for the exact @playwright/test version, pinned by
  # digest; anything else stops CI here.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.read.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/playwright-image
          sparse-checkout-cone-mode: false
      - id: read
        run: |
          REF="$(tr -d '[:space:]' < .github/playwright-image)"
          echo "$REF" | grep -Eqx 'mcr\.microsoft\.com/playwright:v[0-9]+\.[0-9]+\.[0-9]+-noble@sha256:[0-9a-f]{64}'
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

  # One job per Playwright project, in parallel. Microsoft's image already
  # holds the browsers and system libraries for this exact Playwright version,
  # so nothing is installed with apt on the runner.
  browsers:
    name: browsers (${{ matrix.project }})
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ${{ needs.image.outputs.ref }}
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome, mobile-safari]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure-evidence-${{ matrix.project }}
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

  # The check branch protection requires. It reports even when a job above
  # failed or was cancelled, and passes only when every one of them passed.
  quality:
    needs: [checks, image, browsers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A required CI job did not pass." >&2
          exit 1
      - run: echo "Every CI job passed."

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
